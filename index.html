<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voting Ketua DKM</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:520px;
  background:#fff;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 10px 35px rgba(0,0,0,.25);
}

.header{
  background:#16a34a;
  color:white;
  text-align:center;
  padding:30px 20px;
}

.logo{
  width:90px;
  height:90px;
  border-radius:50%;
  background:white;
  margin:0 auto 15px;
  overflow:hidden;
  border:4px solid rgba(255,255,255,.3);
}

.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.header h1{
  font-size:28px;
  margin-bottom:8px;
}

.header p{
  font-size:14px;
  opacity:.9;
}

.content{
  padding:30px;
}

.form-group{
  margin-bottom:22px;
}

.title{
  display:block;
  margin-bottom:10px;
  font-weight:600;
  color:#1e293b;
}

input[type="text"]{
  width:100%;
  padding:14px;
  border:1px solid #cbd5e1;
  border-radius:14px;
  font-size:16px;
  transition:.3s;
}

input[type="text"]:focus{
  border-color:#16a34a;
  outline:none;
  box-shadow:0 0 0 4px rgba(22,163,74,.15);
}

.candidate{
  border:2px solid #e2e8f0;
  border-radius:16px;
  padding:15px;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  transition:.3s;
}

.candidate:hover{
  border-color:#16a34a;
  background:#f0fdf4;
  transform:translateY(-2px);
}

.candidate input{
  transform:scale(1.3);
  accent-color:#16a34a;
}

.candidate-name{
  font-size:16px;
  font-weight:600;
  color:#0f172a;
}

button{
  width:100%;
  border:none;
  padding:16px;
  background:#16a34a;
  color:white;
  border-radius:16px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  background:#15803d;
}

button:disabled{
  opacity:.7;
  cursor:not-allowed;
}

.success{
  background:#dcfce7;
  color:#166534;
  padding:14px;
  border-radius:14px;
  margin-bottom:20px;
  display:none;
  text-align:center;
  font-weight:600;
}

.footer{
  text-align:center;
  font-size:13px;
  color:#64748b;
  margin-top:20px;
}

@media(max-width:600px){

  .container{
    border-radius:18px;
  }

  .header{
    padding:25px 15px;
  }

  .header h1{
    font-size:22px;
  }

  .content{
    padding:20px;
  }

}

</style>
</head>

<body>

<div class="container">

  <div class="header">

    <div class="logo">

      <!-- GANTI DENGAN LOGO SENDIRI -->
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/6/6b/Bitmap_VS_SVG.svg"
        alt="Logo DKM"
      >

    </div>

    <h1>Voting Ketua DKM</h1>

    <p>
      Pemilihan Ketua DKM Musholla Nurul Huda
      Pondok Dewata Tigaraksa
    </p>

  </div>

  <div class="content">

    <div class="success" id="successBox">
      Voting berhasil dikirim
    </div>

    <form id="voteForm">

      <div class="form-group">

        <label class="title">
          Nama Pemilih
        </label>

        <input
          type="text"
          id="nama"
          placeholder="Masukkan nama lengkap"
          required
        >

      </div>

      <div class="form-group">

        <label class="title">
          Tempat / Alamat
        </label>

        <input
          type="text"
          id="tempat"
          placeholder="Masukkan alamat atau tempat tinggal"
          required
        >

      </div>

      <div class="form-group">

        <label class="title">
          Pilih Kandidat Ketua DKM
        </label>

        <label class="candidate">

          <input
            type="radio"
            name="ketua"
            value="Tasripin"
            required
          >

          <div class="candidate-name">
            Tasripin
          </div>

        </label>

        <label class="candidate">

          <input
            type="radio"
            name="ketua"
            value="Kurnia"
          >

          <div class="candidate-name">
            Kurnia
          </div>

        </label>

        <label class="candidate">

          <input
            type="radio"
            name="ketua"
            value="Anto"
          >

          <div class="candidate-name">
            Anto
          </div>

        </label>

      </div>

      <button type="submit" id="btnKirim">
        Kirim Voting
      </button>

    </form>

    <div class="footer">
      © 2026 DKM Musholla Nurul Huda
    </div>

  </div>

</div>

<script>

const form =
  document.getElementById("voteForm");

const btn =
  document.getElementById("btnKirim");

const successBox =
  document.getElementById("successBox");

form.addEventListener("submit", async function(e){

  e.preventDefault();

  const nama =
    document.getElementById("nama")
    .value
    .trim();

  const tempat =
    document.getElementById("tempat")
    .value
    .trim();

  const kandidat =
    document.querySelector(
      'input[name="ketua"]:checked'
    );

  if(!kandidat){

    alert("Silakan pilih kandidat");

    return;

  }

  const ketua =
    kandidat.value;

  btn.disabled = true;

  btn.innerText = "Mengirim...";

  // =====================================
  // GANTI DENGAN URL WEB APP ANDA
  // =====================================

  const scriptURL =
    "https://script.google.com/macros/s/AKfycbzPGsOAL6HOlEzwWHCsjVE3c80z6YDQPOWM9Wv8QJqqAU57bclV3ydEdkB6E5RI_EnY/exec";

  const data = {

    nama: nama,
    tempat: tempat,
    ketua: ketua

  };

  try{

    const response =
      await fetch(scriptURL, {

      method: "POST",

      body: JSON.stringify(data)

    });

    const result =
      await response.json();

    if(result.status === "success"){

      successBox.style.display = "block";

      form.reset();

      setTimeout(function(){

        successBox.style.display = "none";

      },3000);

    }else{

      alert("Gagal mengirim voting");

    }

  }catch(error){

    console.log(error);

    alert("Terjadi kesalahan koneksi");

  }

  btn.disabled = false;

  btn.innerText = "Kirim Voting";

});

</script>

</body>
</html>
