<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voting Ketua DKM</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body{
      min-height:100vh;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:520px;
      background:white;
      border-radius:24px;
      overflow:hidden;
      box-shadow:0 10px 35px rgba(0,0,0,0.25);
    }

    .header{
      background:#16a34a;
      color:white;
      text-align:center;
      padding:30px 20px;
    }

    .logo{
      width:90px;
      height:90px;
      border-radius:50%;
      background:white;
      margin:0 auto 15px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      border:4px solid rgba(255,255,255,0.3);
    }

    .logo img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .header h1{
      font-size:28px;
      margin-bottom:8px;
    }

    .header p{
      font-size:14px;
      opacity:0.9;
    }

    .content{
      padding:30px;
    }

    .form-group{
      margin-bottom:22px;
    }

    label{
      display:block;
      margin-bottom:10px;
      font-weight:600;
      color:#1e293b;
    }

    input[type="text"]{
      width:100%;
      padding:14px;
      border:1px solid #cbd5e1;
      border-radius:14px;
      font-size:16px;
      transition:0.3s;
    }

    input[type="text"]:focus{
      border-color:#16a34a;
      outline:none;
      box-shadow:0 0 0 4px rgba(22,163,74,0.15);
    }

    .candidate{
      border:2px solid #e2e8f0;
      border-radius:16px;
      padding:15px;
      margin-bottom:14px;
      display:flex;
      align-items:center;
      gap:12px;
      transition:0.3s;
      cursor:pointer;
    }

    .candidate:hover{
      border-color:#16a34a;
      background:#f0fdf4;
      transform:translateY(-2px);
    }

    .candidate input{
      transform:scale(1.3);
      accent-color:#16a34a;
    }

    .candidate-name{
      font-size:16px;
      font-weight:600;
      color:#0f172a;
    }

    button{
      width:100%;
      border:none;
      padding:16px;
      background:#16a34a;
      color:white;
      border-radius:16px;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#15803d;
      transform:translateY(-2px);
    }

    .footer{
      text-align:center;
      font-size:13px;
      color:#64748b;
      margin-top:20px;
    }

    @media(max-width:600px){

      .container{
        border-radius:18px;
      }

      .header{
        padding:25px 15px;
      }

      .header h1{
        font-size:22px;
      }

      .content{
        padding:20px;
      }

      .candidate{
        padding:14px;
      }

      button{
        font-size:16px;
      }
    }

  </style>
</head>
<body>

<div class="container">

  <div class="header">

    <!-- GANTI LOGO -->
    <div class="logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/Bitmap_VS_SVG.svg" alt="Logo DKM">
    </div>

    <h1>Voting Ketua DKM</h1>
    <p>Pemilihan Ketua DKM Musholla Nurul Huda Pondok Dewata Tigaraksa</p>

  </div>

  <div class="content">

    <form id="voteForm">

      <div class="form-group">
        <label>Nama Pemilih</label>
        <input type="text" id="nama" placeholder="Masukkan nama lengkap" required>
      </div>

      <div class="form-group">
        <label>Tempat / Alamat</label>
        <input type="text" id="tempat" placeholder="Masukkan alamat atau tempat tinggal" required>
      </div>

      <div class="form-group">
        <label>Pilih Kandidat Ketua DKM</label>

        <label class="candidate">
          <input type="radio" name="ketua" value="Tasripin" required>
          <div class="candidate-name">Tasripin</div>
        </label>

        <label class="candidate">
          <input type="radio" name="ketua" value="Kurnia">
          <div class="candidate-name">Kurnia</div>
        </label>

        <label class="candidate">
          <input type="radio" name="ketua" value="Anto">
          <div class="candidate-name">Anto</div>
        </label>

      </div>

      <button type="submit">Kirim Voting</button>

    </form>

    <div class="footer">
      © 2026 DKM Musholla Nurul Huda Pondok Dewata Tigaraksa - Sistem Voting Digital
    </div>

  </div>
</div>

<script>

  const form = document.getElementById("voteForm");

  form.addEventListener("submit", function(e){

    e.preventDefault();

    const nama = document.getElementById("nama").value;
    const tempat = document.getElementById("tempat").value;
    const ketua = document.querySelector('input[name="ketua"]:checked').value;

    // GANTI NOMOR WHATSAPP ADMIN
    const nomorAdmin = "6281293932322";

    const pesan =
`🕌 *VOTING KETUA DKM*

👤 Nama: ${nama}
📍 Tempat: ${tempat}
🗳 Pilihan: ${ketua}`;

    const url = `https://wa.me/${nomorAdmin}?text=${encodeURIComponent(pesan)}`;

    window.open(url, "_blank");

    form.reset();

  });

</script>

</body>
</html>
